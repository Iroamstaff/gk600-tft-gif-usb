<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GK600 — Panneau</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e0f12; --panel: #16181d; --card: #1c1f26; --line: #2a2e37; --text: #e8eaef; --muted: #9aa1ad;
    --accent: #e2231a; --accent-2: #ff5a4f; --ok: #35c46a; --warn: #f0a92b; --bad: #ef4b4b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
  .brand .logo { font-weight: 800; font-size: 22px; letter-spacing: 1px; }
  .brand .logo b { color: var(--accent); }
  .brand .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px;
    background: transparent; cursor: pointer; text-align: left; color: var(--muted); }
  nav button svg { width: 18px; height: 18px; flex: none; }
  nav button:hover { background: #20242c; color: var(--text); }
  nav button.active { background: #2a1415; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; color: var(--muted); font-size: 12px; }
  .lang { display: flex; gap: 6px; }
  .lang button { flex: 1; padding: 5px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); }
  .lang button.on { background: var(--card); color: var(--text); border-color: #444b57; }
  main { padding: 22px 28px 40px; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .top h1 { margin: 0; font-size: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  .banner.warn { background: #2e2412; border: 1px solid #5c4516; color: #f6d38f; }
  .banner.bad { background: #2f1416; border: 1px solid #63262a; color: #f7b3b3; }
  .hidden { display: none !important; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 18px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
    min-height: 150px; border: 2px dashed #3a404b; border-radius: 12px; padding: 16px; cursor: pointer; color: var(--muted); transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: #1f1416; }
  .drop svg { width: 34px; height: 34px; opacity: .8; }
  .drop .fname { color: var(--text); font-weight: 600; word-break: break-all; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
  .row label { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .screen { width: 100%; max-width: 480px; aspect-ratio: 160 / 96; background: #000; border-radius: 10px; border: 6px solid #050506;
    box-shadow: 0 0 0 1px #2e333c, 0 10px 30px #0008; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .screen img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
  .screen .empty { color: #555c68; font-size: 13px; padding: 20px; text-align: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { background: #3a3f49; color: #8b92a0; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid #444b57; color: var(--text); }
  .btn.ghost:hover { background: #242830; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .note b { color: var(--text); font-weight: 600; }
  .why { font-size: 13px; color: var(--warn); margin-top: 8px; }
  .spin { width: 16px; height: 16px; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  select, input[type=color] { background: #14161b; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=color] { width: 54px; height: 36px; padding: 2px; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .field { margin: 14px 0; }
  .field-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line); background: #14161b; cursor: pointer; }
  .seg button.on { border-color: var(--accent); background: #2a1415; }
  .swatch { height: 70px; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(90deg, #e2231a, #e2231a); }
  .swatch.rainbow { background: linear-gradient(90deg, #f33, #fb3, #3f6, #3cf, #66f, #f3f); }
  .about p { max-width: 820px; }
  .about a { color: #7fb2ff; }
  pre.log { background: #0b0c0f; border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 300px; overflow: auto;
    font-size: 12px; white-space: pre-wrap; color: #b9c0cc; }
  /* job window */
  .overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px #000c; }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .steps { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); }
  .steps li .mark { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid #3a404b; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .steps li.now { color: var(--text); } .steps li.now .mark { border-color: var(--accent); }
  .steps li.ok { color: var(--text); } .steps li.ok .mark { border-color: var(--ok); background: var(--ok); color: #06150c; }
  .howto { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0 12px; font-size: 14px; }
  .howto ol { margin: 6px 0 0; padding-left: 20px; }
  .bar { height: 10px; background: #262a33; border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .result { padding: 12px 14px; border-radius: 10px; margin: 10px 0; }
  .result.ok { background: #10291a; border: 1px solid #1e5a35; color: #b9f0cd; }
  .result.bad { background: #2f1416; border: 1px solid #63262a; color: #f7b3b3; }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details pre { white-space: pre-wrap; font-size: 12px; }
  /* sidebar groups */
  .nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6d7480; margin: 10px 12px 2px; }
  .kbdlayout { display: flex; gap: 6px; }
  .kbdlayout button { flex: 1; padding: 5px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); font-size: 12px; }
  .kbdlayout button.on { background: var(--card); color: var(--text); border-color: #444b57; }
  /* keyboard picture */
  .kcard { padding: 16px 18px 14px; margin-bottom: 18px; }
  .kbd { position: relative; width: 100%; --u: 40px; height: calc(var(--u) * 6.25); user-select: none; -webkit-user-select: none; touch-action: none; }
  .kbd .k { position: absolute; border-radius: calc(var(--u) * .14); background: #262a32; border: 1px solid #3b414c; color: #d9dde5;
    font-size: calc(var(--u) * .25); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    cursor: pointer; overflow: hidden; line-height: 1.1; padding: 1px 2px; box-shadow: inset 0 -3px 0 #0004; }
  .kbd .k:hover { border-color: #7b8494; }
  .kbd .k.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
  .kbd .k.changed { border-color: var(--warn); }
  .kbd .k.fixed { cursor: not-allowed; opacity: .55; }
  .kbd .k .fx { font-size: calc(var(--u) * .2); color: #f6d38f; margin-top: 1px; max-width: 100%; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .kbd .k.iso { clip-path: polygon(0 0, 100% 0, 100% 100%, 16.7% 100%, 16.7% 50%, 0 50%); justify-content: flex-start; padding-top: calc(var(--u) * .3); }
  .kbd .screenbox { position: absolute; background: #050506; border: 1px solid #2e333c; border-radius: calc(var(--u) * .12);
    color: #4b525e; font-size: calc(var(--u) * .2); display: flex; align-items: center; justify-content: center; }
  .grid2 { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
  .pal { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .pal button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffffff22; cursor: pointer; padding: 0; }
  .pal button.on { border-color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #14161b; cursor: pointer; font-size: 13px; }
  .chips button:hover { border-color: var(--accent); }
  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .seg.narrow { min-width: 320px; }
  .types { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .types button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #14161b; cursor: pointer; font-size: 13px; }
  .types button.on { border-color: var(--accent); background: #2a1415; }
  .mods { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; }
  .mods label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
  .mods input { accent-color: var(--accent); }
  .capture { border: 2px dashed #3a404b; border-radius: 10px; padding: 10px; text-align: center; color: var(--muted); cursor: pointer; margin: 8px 0; }
  .capture.on { border-color: var(--accent); color: var(--text); background: #1f1416; }
  .wide-select { width: 100%; }
  .mlist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
  .mlist button { text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: #14161b; cursor: pointer; }
  .mlist button.on { border-color: var(--accent); background: #2a1415; }
  .mlist button .sub { color: var(--muted); font-size: 12px; }
  .steps-list { max-height: 330px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; }
  .steps-list .st { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #22262e; font-size: 14px; }
  .steps-list .st:last-child { border-bottom: 0; }
  .steps-list .st .what { flex: 1; }
  .steps-list .st input { width: 80px; background: #14161b; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .steps-list .st button, .icon-btn { border: 1px solid var(--line); background: #14161b; border-radius: 6px; cursor: pointer; padding: 2px 8px; }
  .steps-list .empty { padding: 14px; color: var(--muted); font-size: 13px; text-align: center; }
  .addrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .addrow select, .addrow input[type=number] { background: #14161b; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .addrow input[type=number] { width: 90px; }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .btn.rec { background: #8d1d17; }
  .btn.rec.on { background: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .6; } }
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .prof { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #14161b; }
  .prof .pname { font-weight: 600; flex: 1; min-width: 160px; }
  .prof .pmeta { color: var(--muted); font-size: 12px; width: 100%; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid #444b57; color: var(--muted); margin-left: 6px; }
  .badge.backup { border-color: #1e5a35; color: #b9f0cd; }
  .msg-ok { color: #b9f0cd; } .msg-bad { color: #f7b3b3; }
  .dirty { color: var(--warn); font-size: 13px; }
  input[type=text] { background: #14161b; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; }
    nav { flex-direction: row; flex-wrap: wrap; } nav button { width: auto; }
    .side-bottom { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
    .grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">GK<b>600</b></div><div class="sub" data-t="brand_sub"></div></div>
    <nav id="nav">
      <div class="nav-group" data-t="grp_screen"></div>
      <button data-tab="gif" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-t="nav_gif"></span></button>
      <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home"></span></button>
      <button data-tab="boot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9M7 6.5a8 8 0 1 0 10 0"/></svg><span data-t="nav_boot"></span></button>
      <button data-tab="repair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.6-.6-.6-2.6z"/></svg><span data-t="nav_repair"></span></button>
      <div class="nav-group" data-t="grp_keyboard"></div>
      <button data-tab="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span data-t="nav_light"></span></button>
      <button data-tab="perkey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor"/></svg><span data-t="nav_perkey"></span></button>
      <button data-tab="keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span data-t="nav_keys"></span></button>
      <button data-tab="macros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M4 12h7M4 18h10M17 9l4 3-4 3z"/></svg><span data-t="nav_macros"></span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="nav_settings"></span></button>
      <button data-tab="profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span data-t="nav_profiles"></span></button>
      <div class="nav-group"></div>
      <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="nav_about"></span></button>
    </nav>
    <div class="side-bottom">
      <div class="lang"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
      <div class="kbdlayout" title=""><button data-kl="fr">AZERTY</button><button data-kl="us">QWERTY</button></div>
      <div id="ver"></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <h1 id="title"></h1>
      <div class="pill"><span id="pill-dot" class="dot"></span><span id="pill-text"></span></div>
    </header>
    <div id="banner" class="banner hidden"></div>

    <!-- GIF -->
    <section class="tab" id="tab-gif">
      <p class="lead" data-t="gif_lead"></p>
      <div class="grid">
        <div class="card">
          <h2 data-t="step_file"></h2>
          <div class="drop" data-kind="gif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span class="fname"></span><span data-t="drop_anim"></span></div>
          <label class="check"><input type="checkbox" id="gif-fill"><span data-t="fill"></span></label>
          <dl class="facts" id="gif-facts"></dl>
          <div class="actions"><button class="btn" id="gif-go" disabled data-t="gif_go"></button></div>
          <div class="why" id="gif-why"></div>
          <p class="note" data-t="gif_note"></p>
        </div>
        <div><div class="screen" id="gif-screen"><div class="empty" data-t="preview_empty"></div></div></div>
      </div>
    </section>

    <!-- lighting -->
    <section class="tab hidden" id="tab-light">
      <p class="lead" data-t="light_lead"></p>
      <div class="grid">
        <div class="card">
          <div class="field"><div class="field-head"><span data-t="effect"></span></div><select id="effect" style="width:100%"></select></div>
          <div class="fx-only"><div class="row"><label data-t="color"></label><input type="color" id="color" value="#ff0000"></div>
          <label class="check"><input type="checkbox" id="multi"><span data-t="multicolour"></span></label></div>

let lang = "fr";
try { lang = localStorage.getItem("gk600-lang") || ((navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"); } catch (e) {
  lang = (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"; }

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const t = (k, p) => { let s = (T[lang] && T[lang][k]) || T.en[k] || k; for (const [a, b] of Object.entries(p || {})) s = s.split("{" + a + "}").join(b); return s; };

let status = null, offline = false, tab = "gif";
const files = { gif: null, home: null, boot: null };          // { file, id, info, url }
let lastJobId = null, jobShownId = null, lightMsgTimer = null;

async function api(path, opts = {}) {
  const headers = Object.assign({ "X-Token": GK.token }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  const ctype = r.headers.get("Content-Type") || "";
  if (ctype.startsWith("application/json")) {
    const j = await r.json();
    if (!r.ok || j.ok === false) { const e = new Error(j.error || "failed"); e.key = j.error || "failed"; e.detail = j.detail || ""; throw e; }
    return j;
  }
  if (!r.ok) { const e = new Error("failed"); e.key = "failed"; throw e; }
  return r.blob();
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $$(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  $$(".kbdlayout button").forEach((b) => b.classList.toggle("on", b.dataset.kl === kbLayout));
  $("#title").textContent = t("title_" + tab);
  document.title = "GK600 — " + t("title_" + tab);
  $("#prof-name").placeholder = t("prof_name_ph");
  fillEffects(); renderDirection(); render(); renderFacts(); swatch();
  if (catalog) renderKbTab();
  if (tab === "profiles") renderProfiles();
  resay();
}

function showTab(name) {
  tab = name;
  $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  $$(".tab").forEach((s) => s.classList.toggle("hidden", s.id !== "tab-" + name));
  $("#title").textContent = t("title_" + name);
  document.title = "GK600 — " + t("title_" + name);
  if (name === "about") loadLog();
  if (name !== "keys") stopCapture();
  if (name !== "macros") stopRecording();
  if (KB_TABS[name]) ensureKB(name);
  if (name === "profiles") { loadCatalog().catch(() => {}); loadProfiles(); }
}

/* ------------------------------------------------------------------ status */
async function poll() {
  try {
    status = await api("/api/status");
    offline = false;
    if (!lightingLoaded) { loadLighting(); applyLang(); }
  } catch (e) {
    offline = true;
  }
  render();
  const job = status && status.job;
  if (job && (job.phase !== "done" && job.phase !== "error" && job.phase !== "cancelled" || job.id === jobShownId)) showJob(job);
  setTimeout(poll, job && ["done", "error", "cancelled"].indexOf(job.phase) < 0 ? 600 : 1500);
}

function render() {
  if (!status && !offline) return;
  const dot = $("#pill-dot"), txt = $("#pill-text"), ban = $("#banner");
  let banner = null, level = "warn";
  if (offline) { dot.className = "dot bad"; txt.textContent = t("st_offline"); banner = t("ban_offline"); level = "bad"; }
  else if (status.conflicts && status.conflicts.length) { dot.className = "dot warn"; txt.textContent = t("st_conflict"); banner = t("ban_conflict", { names: status.conflicts.join(", ") }); }
  else if (status.keyboard_error === "several") { dot.className = "dot warn"; txt.textContent = t("st_many"); banner = t("ban_many"); }
  else if (!status.keyboard) { dot.className = "dot bad"; txt.textContent = t("st_none"); banner = t("ban_none"); level = "bad"; }
  else {
    const kb = status.keyboard;
    dot.className = "dot " + (kb.validated ? "ok" : "warn");
    txt.textContent = t("st_found", { name: (kb.product || kb.name).replace(/ Keyboard$/i, ""), fw: kb.firmware });
    if (!kb.validated) banner = t("ban_unvalidated", { fw: kb.firmware });
  }
  ban.classList.toggle("hidden", !banner);
  if (banner) { ban.textContent = banner; ban.className = "banner " + level; }
  if (!status) return;

  const ready = !offline && status.keyboard && !(status.conflicts && status.conflicts.length);
  const busy = status.job && ["done", "error", "cancelled"].indexOf(status.job.phase) < 0;
  const validated = status.keyboard && status.keyboard.validated;
  const why = (k, needValidated, needRef) => {
    if (offline) return t("ban_offline");
    if (status.conflicts && status.conflicts.length) return t("why_conflict");
    if (!status.keyboard) return t("why_keyboard");
    if (needRef && !status.reference) return t("why_reference");
    if (needRef === "full" && status.reference !== "full") return t("why_full");
    if (needValidated && !validated) return t("why_validated");
    if (k && !files[k]) return t("why_file");
    return "";
  };
  const set = (btn, whyEl, reason) => { $(btn).disabled = !!reason || busy; $(whyEl).textContent = busy ? "" : reason; };
  set("#gif-go", "#gif-why", why("gif", false, false));
  set("#light-go", "#light-why", ready ? "" : why(null, false, false));
  set("#home-go", "#home-why", why("home", true, true));
  set("#boot-go", "#boot-why", why("boot", true, true));
  set("#repair-go", "#repair-why", why(null, true, "full"));

  const home = status.home || {};
  if (home.active !== homeWasActive) { $("#keep-home").checked = !!home.active; homeWasActive = home.active; }
  $("#keep-home").disabled = !home.active;
  $("#keep-home-text").textContent = home.active ? t("keep_home", { name: home.name || "" }) : t("keep_home_none");
  renderKbButtons();
}
let homeWasActive = null;

/* ------------------------------------------------------------------ files */
function fmtMin(m) { return m < 1 ? t("lt1") : t("min", { n: String(Math.round(m * 10) / 10).replace(".", lang === "fr" ? "," : ".") }); }

function renderFacts() {
  for (const kind of ["gif", "home", "boot"]) {
    const el = $("#" + kind + "-facts"), f = files[kind];
    if (!el) continue;
    if (!f || !f.info) { el.innerHTML = ""; continue; }
    const i = f.info, rows = [];
    if (kind !== "home") rows.push([t("frames"), i.frames_in !== i.frames ? t("kept", { n: i.frames, m: i.frames_in }) : String(i.frames)]);
    if (kind === "gif") rows.push([t("loop"), t("sec", { n: String(i.loop_s).replace(".", lang === "fr" ? "," : ".") })]);
    if (kind === "boot") rows.push([t("length"), t("sec", { n: String(i.seconds).replace(".", lang === "fr" ? "," : ".") })]);
    rows.push([t("pages"), String(i.pages)]);

function showJob(job) {
  jobShownId = job.id;
  $("#overlay").classList.remove("hidden");

  const cycle = job.kind !== "gif";
  const order = cycle ? ["cycle", "check", "write", "done"] : ["check", "write", "done"];
  const phaseStep = { starting: cycle ? "cycle" : "check", cycle_off: "cycle", cycle_on: "cycle", check: "check", write: "write", done: "done" };
  const cur = phaseStep[job.phase];

    m.className = "mark"; l.textContent = t("s_" + s);

  else if (job.phase === "write") { howto.innerHTML = `<p class="note">${t("writing")}</p>`; howto.classList.remove("hidden"); }
  else howto.classList.add("hidden");

  const prog = $("#job-progress");

    if (job.phase === "write" && job.eta != null) c += " · " + t("eta", { n: job.eta >= 60 ? Math.floor(job.eta / 60) + " min " + (job.eta % 60) + " s" : job.eta + " s" });
    $("#job-count").textContent = c;
  } else prog.classList.add("hidden");

  const res = $("#job-result"), det = $("#job-details");
  if (job.phase === "done") { res.className = "result ok"; res.textContent = t("done_" + job.kind); }
  else if (job.phase === "error") { res.className = "result bad"; res.textContent = t("e_" + (job.error || "failed")); }
  else if (job.phase === "cancelled") { res.className = "result bad"; res.textContent = t("cancelled"); }

}

/* --- reading and sending */
async function kbRead(parts, msgId) {

  try {
    const r = await post("/api/config/read", { parts });
    parts.forEach((p) => { KB.read[p] = true; });
    for (const p of parts) {
      const unsupported = r.unsupported.indexOf(p) >= 0;
      const v = unsupported ? null : r.parsed[p];
      applyRead(p, v, unsupported ? (r.cached || {})[p] : null);
    }
    say(msgId, () => r.unsupported.length ? t("read_unsupported") : t("read_ok"), r.unsupported.length ? null : true);
    return r;
  } catch (e) { say(msgId, () => errText(e), false); return null; }
  finally { KB.busy = false; renderKbButtons(); }
}

function applyRead(part, v, cached) {
  if (part === "keys" || part === "fnkeys") {
    const layer = part === "keys" ? "main" : "fn";
    KB.keys[layer] = v != null ? v : ((cached && cached.actions) || KB.keys[layer]);
    KB.dirty[part] = false; KB.known[part] = v != null || !!cached;
  } else if (part === "colours") {
    KB.colours = v != null ? v : ((cached && cached.colours) || KB.colours);
    if (cached && cached.brightness) KB.brightness = cached.brightness;
    KB.dirty.colours = false; KB.known.colours = v != null || !!cached;
  } else if (part === "lighting") {

  } else if (part === "macros") {
    if (v != null) {
      const old = (cachedConfig.macros && cachedConfig.macros.macros) || KB.macros;
      KB.macros = v.map((m, i) => (m ? { name: (old[i] && old[i].name) || m.name, steps: m.steps } : null));
    } else if (cached && cached.macros) KB.macros = cached.macros;
    KB.dirty.macros = false; KB.known.macros = v != null || !!cached;

  } else if (part === "settings") {

    KB.dirty.settings = false; KB.known.settings = !!(v || cached);

  finally { KB.busy = false; renderKbButtons(); renderDirty(); }
}

    if (p.backup) n.append(el("span", "badge backup", t("backup_badge")));
    row.append(n);
    const ap = el("button", "btn small apply", t("prof_apply")); ap.addEventListener("click", () => applyProfile(p));
    const op = el("button", "btn ghost small", t("prof_open")); op.addEventListener("click", () => openProfile(p));
    const ex = el("button", "btn ghost small", t("prof_export")); ex.addEventListener("click", () => exportProfile(p));
    const de = el("button", "btn ghost small", t("prof_delete")); de.addEventListener("click", () => deleteProfile(p));
    row.append(ap, op, ex, de, el("div", "pmeta", (p.backup ? "" : p.saved + " · ") + partNames(p.parts)));
    list.append(row);
  });
  renderKbButtons();
}
async function saveProfile() {
  const name = ($("#prof-name").value || "").trim() || (lang === "fr" ? "Profil" : "Profile");
  const p = profileFromPanel(name);
  if (!["keys", "fnkeys", "colours", "lighting", "macros", "settings"].some((k) => p[k] != null)) { say("#prof-msg", () => t("prof_nothing"), false); return; }
  try { await post("/api/profiles/save", { profile: p }); say("#prof-msg", () => t("prof_saved"), true); $("#prof-name").value = ""; }
  catch (e) { say("#prof-msg", () => errText(e), false); }
  loadProfiles();
}
async function backupKeyboard() {
  await loadCatalog();
  const r = await kbRead(["keys", "fnkeys", "colours", "lighting", "macros", "settings"], "#prof-msg");
  if (!r) return;
  const p = { format: "gk600-profile", version: 1, name: (lang === "fr" ? "Clavier le " : "Keyboard on ") + new Date().toLocaleString(lang) };
  const P = r.parsed;
  if (P.keys) p.keys = P.keys; if (P.fnkeys) p.fnkeys = P.fnkeys;
  if (P.colours) p.colours = { colours: P.colours, brightness: (P.lighting && P.lighting.brightness) || 5 };
  if (P.lighting && P.lighting.effect != null) p.lighting = P.lighting;
  if (P.macros) p.macros = P.macros; if (P.settings) p.settings = P.settings;
  try { await post("/api/profiles/save", { profile: p }); say("#prof-msg", () => t("prof_saved"), true); }
  catch (e) { say("#prof-msg", () => errText(e), false); }
  loadProfiles();
}
async function applyProfile(p) {
  if (!kbReady()) { say("#prof-msg", () => kbWhy(), false); return; }
  KB.busy = true; renderKbButtons(); say("#prof-msg", () => t("sending"));
  try {
    const full = (await post("/api/profiles/get", { id: p.id })).profile;
    const r = await post("/api/profiles/apply", { id: p.id });
    say("#prof-msg", () => t("prof_applied", { parts: partNames(r.parts) }), true);
    openProfileData(full, false);
  } catch (e) { say("#prof-msg", () => errText(e), false); }
  finally { KB.busy = false; renderKbButtons(); }
}
function openProfileData(full, dirty) {
  if (full.keys) { KB.keys.main = full.keys; KB.known.keys = true; KB.dirty.keys = dirty; }
  if (full.fnkeys) { KB.keys.fn = full.fnkeys; KB.known.fnkeys = true; KB.dirty.fnkeys = dirty; }
  if (full.colours) { KB.colours = full.colours.colours || {}; KB.brightness = full.colours.brightness || 5; KB.known.colours = true; KB.dirty.colours = dirty; }
  if (full.macros) { KB.macros = full.macros; KB.known.macros = true; KB.dirty.macros = dirty; }
  if (full.settings) { KB.settings = full.settings; KB.known.settings = true; KB.dirty.settings = dirty; }
  if (full.lighting) { if (status) status.lighting = full.lighting.effect === "custom" ? full.lighting : Object.assign({}, status.lighting, full.lighting); lightingLoaded = false; loadLighting(); }
  ["keys", "fnkeys", "colours", "macros", "settings"].forEach((k) => { if (full[k]) KB.read[k] = true; });
  KB.selKey = null; KB.selMacro = null; renderDirty();
}
async function openProfile(p) {
  try {
    await loadCatalog();
    const full = (await post("/api/profiles/get", { id: p.id })).profile;
    openProfileData(full, true);
    say("#prof-msg", () => t("prof_opened"), true);
  } catch (e) { say("#prof-msg", () => errText(e), false); }
}
async function exportProfile(p) {
  try {
    const full = (await post("/api/profiles/get", { id: p.id })).profile;
    const blob = new Blob([JSON.stringify(full, null, 1)], { type: "application/json" });
    const a = el("a"); a.href = URL.createObjectURL(blob);
    a.download = ((full.backup ? "gk600-backup-" + (full.saved || "") : "gk600-" + (full.name || "profile")).replace(/[^\w.-]+/g, "_")) + ".json";
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { say("#prof-msg", () => errText(e), false); }
}
async function deleteProfile(p) {
  if (!confirm(t("prof_confirm_delete", { name: p.backup ? t("prof_backup_name") + " " + p.saved : p.name }))) return;
  try { await post("/api/profiles/delete", { id: p.id }); say("#prof-msg", () => t("prof_deleted"), true); }
  catch (e) { say("#prof-msg", () => errText(e), false); }
  loadProfiles();
}
function importProfile() {
  const input = el("input"); input.type = "file"; input.accept = "application/json,.json"; input.style.display = "none";
  input.addEventListener("change", async () => {
    const f = input.files[0]; input.remove(); if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (!p || p.format !== "gk600-profile") throw Object.assign(new Error("bad"), { key: "bad_profile" });
      delete p.backup;
      await post("/api/profiles/save", { profile: p }); say("#prof-msg", () => t("prof_saved"), true);
    } catch (e) { say("#prof-msg", () => e.key === "bad_profile" || e instanceof SyntaxError ? t("prof_bad") : errText(e), false); }
    loadProfiles();
  });
  document.body.append(input); input.click();
}

/* ------------------------------------------------------------------ misc */
async function loadLog() {
  try { const r = await api("/api/log"); $("#log").textContent = r.lines.join("\n"); } catch (e) { }
}

window.addEventListener("beforeunload", (e) => {
  const j = status && status.job;
  const unsent = Object.values(KB.dirty).some(Boolean);
  if (unsent || (j && ["write", "check", "cycle_on"].indexOf(j.phase) >= 0)) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye", GK.token); } catch (e) { } });

$$("#nav button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
$$(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("gk600-lang", lang); } catch (e) { } applyLang(); }));
$$(".drop").forEach(setupDrop);
$("#gif-fill").addEventListener("change", () => { if (files.gif) upload("gif", files.gif.file); });
$("#boot-fill").addEventListener("change", () => { if (files.boot) upload("boot", files.boot.file); });
["#color", "#multi", "#brightness", "#speed"].forEach((s) => $(s).addEventListener("input", swatch));
$("#light-go").addEventListener("click", applyLight);
$("#gif-go").addEventListener("click", () => startJob("gif"));
$("#home-go").addEventListener("click", () => startJob("home"));
$("#boot-go").addEventListener("click", () => startJob("boot"));
$("#repair-go").addEventListener("click", () => startJob("repair"));
$("#job-cancel").addEventListener("click", () => api("/api/job/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {}));
$("#job-close").addEventListener("click", () => { $("#overlay").classList.add("hidden"); jobShownId = null; });
$("#show-log").addEventListener("click", () => { $("#log").classList.toggle("hidden"); loadLog(); });
$("#ver").textContent = "v" + GK.version;
$("#effect").addEventListener("change", swatch);
$$(".kbdlayout button").forEach((b) => b.addEventListener("click", () => { kbLayout = b.dataset.kl; try { localStorage.setItem("gk600-kbl", kbLayout); } catch (e) { } applyLang(); }));
window.addEventListener("keydown", (e) => { onCapture(e); onRecord(e); }, true);
window.addEventListener("keyup", (e) => { onCapture(e); onRecord(e); }, true);
window.addEventListener("pointerup", () => { painting = false; });
$("#pk-color").addEventListener("input", () => setBrush($("#pk-color").value));
$("#pk-bright").addEventListener("input", () => { KB.brightness = Number($("#pk-bright").value); $("#pk-bright-v").textContent = KB.brightness; KB.dirty.colours = true; renderDirty(); });
$("#pk-send").addEventListener("click", sendColours);
$("#pk-read").addEventListener("click", () => kbRead(["colours", "lighting"], "#pk-msg"));
$$("#layer-seg button").forEach((b) => b.addEventListener("click", () => { KB.layer = b.dataset.layer; KB.selKey = null; stopCapture(); renderKeys(); renderEditor(); }));
$("#keys-send").addEventListener("click", sendLayer);
$("#keys-read").addEventListener("click", () => kbRead(["keys", "fnkeys"], "#keys-msg"));
$("#keys-reset").addEventListener("click", resetLayer);
$("#macro-new").addEventListener("click", newMacro);
$("#macro-del").addEventListener("click", deleteMacro);
$("#macros-send").addEventListener("click", sendMacros);
$("#macros-read").addEventListener("click", () => kbRead(["macros"], "#macros-msg"));
[["#set-no-win", "no_win"], ["#set-no-altf4", "no_alt_f4"], ["#set-no-alttab", "no_alt_tab"]].forEach(([id, key]) =>
  $(id).addEventListener("change", () => { if (!KB.settings) renderSettings(); KB.settings[key] = $(id).checked; settingsChanged(); }));
$("#set-debounce").addEventListener("input", () => { if (!KB.settings) renderSettings(); KB.settings.debounce = Number($("#set-debounce").value); settingsChanged(); });
$("#settings-send").addEventListener("click", sendSettings);
$("#settings-read").addEventListener("click", () => kbRead(["settings"], "#settings-msg"));
$("#prof-save").addEventListener("click", saveProfile);
$("#prof-backup").addEventListener("click", backupKeyboard);
$("#prof-import").addEventListener("click", importProfile);

(async function start() {
  applyLang();
  try { status = await api("/api/status"); } catch (e) { offline = true; }
  loadLighting(); applyLang();
  const j = status && status.job;
  if (j && ["done", "error", "cancelled"].indexOf(j.phase) < 0) showJob(j);
  setTimeout(poll, 1200);
})();
</script>
