<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GK600 — Panneau</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e0f12; --panel: #16181d; --card: #1c1f26; --line: #2a2e37; --text: #e8eaef; --muted: #9aa1ad;
    --accent: #e2231a; --accent-2: #ff5a4f; --ok: #35c46a; --warn: #f0a92b; --bad: #ef4b4b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
  .brand .logo { font-weight: 800; font-size: 22px; letter-spacing: 1px; }
  .brand .logo b { color: var(--accent); }
  .brand .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px;
    background: transparent; cursor: pointer; text-align: left; color: var(--muted); }
  nav button svg { width: 18px; height: 18px; flex: none; }
  nav button:hover { background: #20242c; color: var(--text); }
  nav button.active { background: #2a1415; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; color: var(--muted); font-size: 12px; }
  .lang { display: flex; gap: 6px; }
  .lang button { flex: 1; padding: 5px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); }
  .lang button.on { background: var(--card); color: var(--text); border-color: #444b57; }
  main { padding: 22px 28px 40px; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .top h1 { margin: 0; font-size: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  .banner.warn { background: #2e2412; border: 1px solid #5c4516; color: #f6d38f; }
  .banner.bad { background: #2f1416; border: 1px solid #63262a; color: #f7b3b3; }
  .hidden { display: none !important; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 18px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
    min-height: 150px; border: 2px dashed #3a404b; border-radius: 12px; padding: 16px; cursor: pointer; color: var(--muted); transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: #1f1416; }
  .drop svg { width: 34px; height: 34px; opacity: .8; }
  .drop .fname { color: var(--text); font-weight: 600; word-break: break-all; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
  .row label { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .screen { width: 100%; max-width: 480px; aspect-ratio: 160 / 96; background: #000; border-radius: 10px; border: 6px solid #050506;
    box-shadow: 0 0 0 1px #2e333c, 0 10px 30px #0008; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .screen img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
  .screen .empty { color: #555c68; font-size: 13px; padding: 20px; text-align: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { background: #3a3f49; color: #8b92a0; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid #444b57; color: var(--text); }
  .btn.ghost:hover { background: #242830; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .note b { color: var(--text); font-weight: 600; }
  .why { font-size: 13px; color: var(--warn); margin-top: 8px; }
  .spin { width: 16px; height: 16px; border: 2px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  select, input[type=color] { background: #14161b; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=color] { width: 54px; height: 36px; padding: 2px; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .field { margin: 14px 0; }
  .field-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line); background: #14161b; cursor: pointer; }
  .seg button.on { border-color: var(--accent); background: #2a1415; }
  .swatch { height: 70px; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(90deg, #e2231a, #e2231a); }
  .swatch.rainbow { background: linear-gradient(90deg, #f33, #fb3, #3f6, #3cf, #66f, #f3f); }
  .about p { max-width: 820px; }
  .about a { color: #7fb2ff; }
  pre.log { background: #0b0c0f; border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 300px; overflow: auto;
    font-size: 12px; white-space: pre-wrap; color: #b9c0cc; }
  /* job window */
  .overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px #000c; }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .steps { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); }
  .steps li .mark { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid #3a404b; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .steps li.now { color: var(--text); } .steps li.now .mark { border-color: var(--accent); }
  .steps li.ok { color: var(--text); } .steps li.ok .mark { border-color: var(--ok); background: var(--ok); color: #06150c; }
  .howto { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0 12px; font-size: 14px; }
  .howto ol { margin: 6px 0 0; padding-left: 20px; }
  .bar { height: 10px; background: #262a33; border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .result { padding: 12px 14px; border-radius: 10px; margin: 10px 0; }
  .result.ok { background: #10291a; border: 1px solid #1e5a35; color: #b9f0cd; }
  .result.bad { background: #2f1416; border: 1px solid #63262a; color: #f7b3b3; }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details pre { white-space: pre-wrap; font-size: 12px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; }
    nav { flex-direction: row; flex-wrap: wrap; } nav button { width: auto; }
    .side-bottom { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
    .grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">GK<b>600</b></div><div class="sub" data-t="brand_sub"></div></div>
    <nav id="nav">
      <button data-tab="gif" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-t="nav_gif"></span></button>
      <button data-tab="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span data-t="nav_light"></span></button>
      <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home"></span></button>
      <button data-tab="boot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9M7 6.5a8 8 0 1 0 10 0"/></svg><span data-t="nav_boot"></span></button>
      <button data-tab="repair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.6-.6-.6-2.6z"/></svg><span data-t="nav_repair"></span></button>
      <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="nav_about"></span></button>
    </nav>
    <div class="side-bottom">
      <div class="lang"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
      <div id="ver"></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <h1 id="title"></h1>
      <div class="pill"><span id="pill-dot" class="dot"></span><span id="pill-text"></span></div>
    </header>
    <div id="banner" class="banner hidden"></div>

    <!-- GIF -->
    <section class="tab" id="tab-gif">
      <p class="lead" data-t="gif_lead"></p>
      <div class="grid">
        <div class="card">
          <h2 data-t="step_file"></h2>
          <div class="drop" data-kind="gif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span class="fname"></span><span data-t="drop_anim"></span></div>
          <label class="check"><input type="checkbox" id="gif-fill"><span data-t="fill"></span></label>
          <dl class="facts" id="gif-facts"></dl>
          <div class="actions"><button class="btn" id="gif-go" disabled data-t="gif_go"></button></div>
          <div class="why" id="gif-why"></div>
          <p class="note" data-t="gif_note"></p>
        </div>
        <div><div class="screen" id="gif-screen"><div class="empty" data-t="preview_empty"></div></div></div>
      </div>
    </section>

    <!-- lighting -->
    <section class="tab hidden" id="tab-light">
      <p class="lead" data-t="light_lead"></p>
      <div class="grid">
        <div class="card">
          <div class="field"><div class="field-head"><span data-t="effect"></span></div><select id="effect" style="width:100%"></select></div>
          <div class="row"><label data-t="color"></label><input type="color" id="color" value="#ff0000"></div>
          <label class="check"><input type="checkbox" id="multi"><span data-t="multicolour"></span></label>
          <div class="field"><div class="field-head"><span data-t="brightness"></span><b id="brightness-v"></b></div><input type="range" id="brightness" min="1" max="5" step="1"></div>
          <div class="field"><div class="field-head"><span data-t="speed"></span><b id="speed-v"></b></div><input type="range" id="speed" min="1" max="5" step="1"></div>
          <div class="field"><div class="field-head"><span data-t="direction"></span></div><div class="seg" id="direction"></div></div>
          <div class="actions"><button class="btn" id="light-go" disabled data-t="apply"></button></div>
          <div class="why" id="light-why"></div>
          <div class="note" id="light-msg"></div>
        </div>
        <div class="card"><h2 data-t="light_preview"></h2><div class="swatch" id="swatch"></div><p class="note" data-t="light_note"></p></div>
      </div>
    </section>

    <!-- home picture -->
    <section class="tab hidden" id="tab-home">
      <p class="lead" data-t="home_lead"></p>
      <div class="grid">
        <div class="card">
          <h2 data-t="step_file"></h2>
          <div class="drop" data-kind="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span class="fname"></span><span data-t="drop_pic"></span></div>
          <dl class="facts" id="home-facts"></dl>
          <div class="actions"><button class="btn" id="home-go" disabled data-t="home_go"></button></div>
          <div class="why" id="home-why"></div>
          <p class="note" data-t="home_note"></p>
        </div>
        <div><div class="screen" id="home-screen"><div class="empty" data-t="preview_empty"></div></div></div>
      </div>
    </section>

    <!-- boot animation -->
    <section class="tab hidden" id="tab-boot">
      <p class="lead" data-t="boot_lead"></p>
      <div class="grid">
        <div class="card">
          <h2 data-t="step_file"></h2>
          <div class="drop" data-kind="boot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span class="fname"></span><span data-t="drop_anim"></span></div>
          <label class="check"><input type="checkbox" id="boot-fill"><span data-t="fill"></span></label>
          <label class="check" id="keep-home-row"><input type="checkbox" id="keep-home" checked><span id="keep-home-text"></span></label>
          <dl class="facts" id="boot-facts"></dl>
          <div class="actions"><button class="btn" id="boot-go" disabled data-t="boot_go"></button></div>
          <div class="why" id="boot-why"></div>
          <p class="note" data-t="boot_note"></p>
        </div>
        <div><div class="screen" id="boot-screen"><div class="empty" data-t="preview_empty"></div></div></div>
      </div>
    </section>

    <!-- repair -->
    <section class="tab hidden" id="tab-repair">
      <p class="lead" data-t="repair_lead"></p>
      <div class="card" style="max-width:720px">
        <h2 data-t="repair_title"></h2>
        <p class="note" data-t="repair_text"></p>
        <div class="actions"><button class="btn" id="repair-go" disabled data-t="repair_go"></button></div>
        <div class="why" id="repair-why"></div>
      </div>
    </section>

    <!-- about -->
    <section class="tab hidden about" id="tab-about">
      <p data-t="about_1"></p>
      <p data-t="about_2"></p>
      <p data-t="about_3"></p>
      <div class="actions"><button class="btn ghost" id="show-log" data-t="show_log"></button></div>
      <pre class="log hidden" id="log"></pre>
    </section>
  </main>
</div>

<!-- job window -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="job-title"></h2>
    <ul class="steps" id="job-steps"></ul>
    <div class="howto hidden" id="job-howto"></div>
    <div class="hidden" id="job-progress"><div class="bar"><i id="job-bar"></i></div><div class="note" id="job-count"></div></div>
    <div class="result hidden" id="job-result"></div>
    <details class="hidden" id="job-details"><summary data-t="details"></summary><pre id="job-detail"></pre></details>
    <div class="actions"><button class="btn ghost hidden" id="job-cancel" data-t="cancel"></button><button class="btn hidden" id="job-close" data-t="close"></button></div>
  </div>
</div>

let lang = "fr";
try { lang = localStorage.getItem("gk600-lang") || ((navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"); } catch (e) {
  lang = (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"; }

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const t = (k, p) => { let s = (T[lang] && T[lang][k]) || T.en[k] || k; for (const [a, b] of Object.entries(p || {})) s = s.split("{" + a + "}").join(b); return s; };

let status = null, offline = false, tab = "gif";
const files = { gif: null, home: null, boot: null };          // { file, id, info, url }
let lastJobId = null, jobShownId = null, lightMsgTimer = null;

async function api(path, opts = {}) {
  const headers = Object.assign({ "X-Token": GK.token }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  const ctype = r.headers.get("Content-Type") || "";
  if (ctype.startsWith("application/json")) {
    const j = await r.json();
    if (!r.ok || j.ok === false) { const e = new Error(j.error || "failed"); e.key = j.error || "failed"; e.detail = j.detail || ""; throw e; }
    return j;
  }
  if (!r.ok) { const e = new Error("failed"); e.key = "failed"; throw e; }
  return r.blob();
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $$(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  $("#title").textContent = t("title_" + tab);
  document.title = "GK600 — " + t("title_" + tab);
  fillEffects(); renderDirection(); render(); renderFacts();
}

function showTab(name) {
  tab = name;
  $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  $$(".tab").forEach((s) => s.classList.toggle("hidden", s.id !== "tab-" + name));
  $("#title").textContent = t("title_" + name);
  document.title = "GK600 — " + t("title_" + name);
  if (name === "about") loadLog();
}

/* ------------------------------------------------------------------ status */
async function poll() {
  try {
    status = await api("/api/status");
    offline = false;
    if (!lightingLoaded) { loadLighting(); applyLang(); }
  } catch (e) {
    offline = true;
  }
  render();
  const job = status && status.job;
  if (job && (job.phase !== "done" && job.phase !== "error" && job.phase !== "cancelled" || job.id === jobShownId)) showJob(job);
  setTimeout(poll, job && ["done", "error", "cancelled"].indexOf(job.phase) < 0 ? 600 : 1500);
}

function render() {
  if (!status && !offline) return;
  const dot = $("#pill-dot"), txt = $("#pill-text"), ban = $("#banner");
  let banner = null, level = "warn";
  if (offline) { dot.className = "dot bad"; txt.textContent = t("st_offline"); banner = t("ban_offline"); level = "bad"; }
  else if (status.conflicts && status.conflicts.length) { dot.className = "dot warn"; txt.textContent = t("st_conflict"); banner = t("ban_conflict", { names: status.conflicts.join(", ") }); }
  else if (status.keyboard_error === "several") { dot.className = "dot warn"; txt.textContent = t("st_many"); banner = t("ban_many"); }
  else if (!status.keyboard) { dot.className = "dot bad"; txt.textContent = t("st_none"); banner = t("ban_none"); level = "bad"; }
  else {
    const kb = status.keyboard;
    dot.className = "dot " + (kb.validated ? "ok" : "warn");
    txt.textContent = t("st_found", { name: (kb.product || kb.name).replace(/ Keyboard$/i, ""), fw: kb.firmware });
    if (!kb.validated) banner = t("ban_unvalidated", { fw: kb.firmware });
  }
  ban.classList.toggle("hidden", !banner);
  if (banner) { ban.textContent = banner; ban.className = "banner " + level; }
  if (!status) return;

  const ready = !offline && status.keyboard && !(status.conflicts && status.conflicts.length);
  const busy = status.job && ["done", "error", "cancelled"].indexOf(status.job.phase) < 0;
  const validated = status.keyboard && status.keyboard.validated;
  const why = (k, needValidated, needRef) => {
    if (offline) return t("ban_offline");
    if (status.conflicts && status.conflicts.length) return t("why_conflict");
    if (!status.keyboard) return t("why_keyboard");
    if (needRef && !status.reference) return t("why_reference");
    if (needRef === "full" && status.reference !== "full") return t("why_full");
    if (needValidated && !validated) return t("why_validated");
    if (k && !files[k]) return t("why_file");
    return "";
  };
  const set = (btn, whyEl, reason) => { $(btn).disabled = !!reason || busy; $(whyEl).textContent = busy ? "" : reason; };
  set("#gif-go", "#gif-why", why("gif", false, false));
  set("#light-go", "#light-why", ready ? "" : why(null, false, false));
  set("#home-go", "#home-why", why("home", true, true));
  set("#boot-go", "#boot-why", why("boot", true, true));
  set("#repair-go", "#repair-why", why(null, true, "full"));

  const home = status.home || {};
  if (home.active !== homeWasActive) { $("#keep-home").checked = !!home.active; homeWasActive = home.active; }
  $("#keep-home").disabled = !home.active;
  $("#keep-home-text").textContent = home.active ? t("keep_home", { name: home.name || "" }) : t("keep_home_none");
}
let homeWasActive = null;

/* ------------------------------------------------------------------ files */
function fmtMin(m) { return m < 1 ? t("lt1") : t("min", { n: String(Math.round(m * 10) / 10).replace(".", lang === "fr" ? "," : ".") }); }

function renderFacts() {
  for (const kind of ["gif", "home", "boot"]) {
    const el = $("#" + kind + "-facts"), f = files[kind];
    if (!el) continue;
    if (!f || !f.info) { el.innerHTML = ""; continue; }
    const i = f.info, rows = [];
    if (kind !== "home") rows.push([t("frames"), i.frames_in !== i.frames ? t("kept", { n: i.frames, m: i.frames_in }) : String(i.frames)]);
    if (kind === "gif") rows.push([t("loop"), t("sec", { n: String(i.loop_s).replace(".", lang === "fr" ? "," : ".") })]);
    if (kind === "boot") rows.push([t("length"), t("sec", { n: String(i.seconds).replace(".", lang === "fr" ? "," : ".") })]);
    rows.push([t("pages"), String(i.pages)]);
    rows.push([t("time"), fmtMin(i.minutes)]);
    el.innerHTML = "";
    for (const [a, b] of rows) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = a; dd.textContent = b; el.append(dt, dd); }
  }
}

async function upload(kind, file) {
  const drop = $(`.drop[data-kind="${kind}"]`), screen = $("#" + kind + "-screen");
  drop.querySelector(".fname").textContent = file.name;
  screen.innerHTML = `<div class="empty"><span class="spin" style="display:inline-block;vertical-align:middle"></span> ${t("preparing")}</div>`;
  const fill = (kind === "gif" && $("#gif-fill").checked) || (kind === "boot" && $("#boot-fill").checked) ? "1" : "0";
  try {
    const res = await api(`/api/file?kind=${kind}&fill=${fill}`, { method: "POST", body: file,
      headers: { "X-File-Name": encodeURIComponent(file.name), "Content-Type": "application/octet-stream" } });
    const blob = await api(res.preview);
    if (files[kind] && files[kind].url) URL.revokeObjectURL(files[kind].url);
    const url = URL.createObjectURL(blob);
    files[kind] = { file, id: res.id, info: res.info, url };
    screen.innerHTML = ""; const img = document.createElement("img"); img.src = url; img.alt = ""; screen.append(img);
  } catch (e) {
    files[kind] = null;
    screen.innerHTML = `<div class="empty">${t("e_" + (e.key || "failed"))}</div>`;
  }
  renderFacts(); render();
}

function setupDrop(drop) {
  const kind = drop.dataset.kind;
  const input = document.createElement("input");
  input.type = "file"; input.accept = kind === "home" ? "image/png,image/jpeg,image/gif,image/webp,image/bmp" : "image/gif,image/png,image/jpeg,image/webp";
  input.style.display = "none"; drop.after(input);
  drop.addEventListener("click", () => input.click());
  input.addEventListener("change", () => { if (input.files[0]) upload(kind, input.files[0]); input.value = ""; });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(kind, f); });
}

/* ------------------------------------------------------------------ lighting */
let direction = 0;
function fillEffects() {
  const sel = $("#effect"), keep = sel.value;
  sel.innerHTML = "";
  ((status && status.effects) || []).forEach((e, i) => { const o = document.createElement("option"); o.value = i; o.textContent = lang === "fr" ? e.fr : e.en; sel.append(o); });
  if (keep !== "") sel.value = keep;
}
function renderDirection() {
  const box = $("#direction"); box.innerHTML = "";
  for (let i = 0; i < 4; i++) { const b = document.createElement("button"); b.textContent = String(i + 1); b.className = i === direction ? "on" : "";
    b.addEventListener("click", () => { direction = i; renderDirection(); }); box.append(b); }
}
function swatch() {
  const s = $("#swatch"); s.classList.toggle("rainbow", $("#multi").checked);
  if (!$("#multi").checked) s.style.background = `linear-gradient(90deg, ${$("#color").value}, ${$("#color").value})`; else s.style.background = "";
  $("#brightness-v").textContent = $("#brightness").value; $("#speed-v").textContent = $("#speed").value;
  s.style.opacity = String(0.35 + 0.13 * Number($("#brightness").value));
}
let lightingLoaded = false;
function loadLighting() {
  if (lightingLoaded || !status) return;
  const l = status.lighting; lightingLoaded = true;
  fillEffects(); $("#effect").value = l.effect; $("#color").value = l.color; $("#multi").checked = !!l.multicolour;
  $("#brightness").value = l.brightness; $("#speed").value = l.speed; direction = l.direction || 0; renderDirection(); swatch();
}
async function applyLight() {
  const btn = $("#light-go"); btn.disabled = true;
  const msg = $("#light-msg"); msg.textContent = "";
  try {
    await api("/api/light", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      effect: Number($("#effect").value), color: $("#color").value, multicolour: $("#multi").checked,
      brightness: Number($("#brightness").value), speed: Number($("#speed").value), direction }) });
    msg.textContent = t("light_ok");
  } catch (e) { msg.textContent = t("e_" + (e.key || "failed")) + (e.detail ? " (" + e.detail + ")" : ""); }
  clearTimeout(lightMsgTimer); lightMsgTimer = setTimeout(() => { msg.textContent = ""; }, 6000);
  render();
}

/* ------------------------------------------------------------------ jobs */
async function startJob(kind) {
  const body = { kind };
  if (kind !== "repair") { if (!files[kind]) return; body.id = files[kind].id; }
  if (kind === "boot") body.keep_home = $("#keep-home").checked;
  try {
    const r = await api("/api/job", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    jobShownId = r.job.id; showJob(r.job);
  } catch (e) {
    jobShownId = "local"; showJob({ id: "local", kind, phase: "error", error: e.key, detail: e.detail || "" });
  }
}

function showJob(job) {
  jobShownId = job.id;
  $("#overlay").classList.remove("hidden");
  $("#job-title").textContent = t("job_" + job.kind);
  const cycle = job.kind !== "gif";
  const order = cycle ? ["cycle", "check", "write", "done"] : ["check", "write", "done"];
  const phaseStep = { starting: cycle ? "cycle" : "check", cycle_off: "cycle", cycle_on: "cycle", check: "check", write: "write", done: "done" };
  const cur = phaseStep[job.phase];
  const curIdx = cur ? order.indexOf(cur) : -1;
  const ul = $("#job-steps"); ul.innerHTML = "";
  order.forEach((s, i) => {
    const li = document.createElement("li"), m = document.createElement("span"), l = document.createElement("span");
    m.className = "mark"; l.textContent = t("s_" + s);
    const ok = job.phase === "done" || (curIdx > i);
    li.className = ok ? "ok" : (i === curIdx ? "now" : "");
    m.textContent = ok ? "✓" : String(i + 1); li.append(m, l); ul.append(li);
  });
  const howto = $("#job-howto");
  if (job.phase === "cycle_off" || job.phase === "cycle_on" || (job.phase === "starting" && cycle)) {
    howto.innerHTML = t("howto_cycle") + `<p class="note">${job.phase === "cycle_on" ? t("cycle_on") : t("cycle_off")}</p>`;
    howto.classList.remove("hidden");
  } else if (job.phase === "check") { howto.innerHTML = `<p class="note">${t("checking")}</p>`; howto.classList.remove("hidden"); }
  else if (job.phase === "write") { howto.innerHTML = `<p class="note">${t("writing")}</p>`; howto.classList.remove("hidden"); }
  else howto.classList.add("hidden");

  const prog = $("#job-progress");
  if (job.phase === "write" || (job.phase === "done" && job.total)) {
    prog.classList.remove("hidden");
    const pct = job.total ? Math.round(100 * job.done / job.total) : 0;
    $("#job-bar").style.width = (job.phase === "done" ? 100 : pct) + "%";
    let c = t("count", { d: job.done, t: job.total });
    if (job.phase === "write" && job.eta != null) c += " · " + t("eta", { n: job.eta >= 60 ? Math.floor(job.eta / 60) + " min " + (job.eta % 60) + " s" : job.eta + " s" });
    $("#job-count").textContent = c;
  } else prog.classList.add("hidden");

  const res = $("#job-result"), det = $("#job-details");
  if (job.phase === "done") { res.className = "result ok"; res.textContent = t("done_" + job.kind); }
  else if (job.phase === "error") { res.className = "result bad"; res.textContent = t("e_" + (job.error || "failed")); }
  else if (job.phase === "cancelled") { res.className = "result bad"; res.textContent = t("cancelled"); }
  else res.className = "result hidden";
  det.classList.toggle("hidden", !(job.phase === "error" && job.detail));
  $("#job-detail").textContent = job.detail || "";

  const finished = ["done", "error", "cancelled"].indexOf(job.phase) >= 0;
  $("#job-cancel").classList.toggle("hidden", finished || job.phase === "write");
  $("#job-close").classList.toggle("hidden", !finished);
}

/* ------------------------------------------------------------------ misc */
async function loadLog() {
  try { const r = await api("/api/log"); $("#log").textContent = r.lines.join("\n"); } catch (e) { }
}

window.addEventListener("beforeunload", (e) => {
  const j = status && status.job;
  if (j && ["write", "check", "cycle_on"].indexOf(j.phase) >= 0) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye", GK.token); } catch (e) { } });

$$("#nav button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
$$(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("gk600-lang", lang); } catch (e) { } applyLang(); }));
$$(".drop").forEach(setupDrop);
$("#gif-fill").addEventListener("change", () => { if (files.gif) upload("gif", files.gif.file); });
$("#boot-fill").addEventListener("change", () => { if (files.boot) upload("boot", files.boot.file); });
["#color", "#multi", "#brightness", "#speed"].forEach((s) => $(s).addEventListener("input", swatch));
$("#light-go").addEventListener("click", applyLight);
$("#gif-go").addEventListener("click", () => startJob("gif"));
$("#home-go").addEventListener("click", () => startJob("home"));
$("#boot-go").addEventListener("click", () => startJob("boot"));
$("#repair-go").addEventListener("click", () => startJob("repair"));
$("#job-cancel").addEventListener("click", () => api("/api/job/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {}));
$("#job-close").addEventListener("click", () => { $("#overlay").classList.add("hidden"); jobShownId = null; });
$("#show-log").addEventListener("click", () => { $("#log").classList.toggle("hidden"); loadLog(); });
$("#ver").textContent = "v" + GK.version;

(async function start() {
  applyLang();
  try { status = await api("/api/status"); } catch (e) { offline = true; }
  loadLighting(); applyLang();
  const j = status && status.job;
  if (j && ["done", "error", "cancelled"].indexOf(j.phase) < 0) showJob(j);
  setTimeout(poll, 1200);
})();
</script>
</body>
